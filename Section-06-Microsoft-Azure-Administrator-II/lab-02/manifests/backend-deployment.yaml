apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: webapp-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: nginx:alpine
        ports:
        - containerPort: 80
        env:
        - name: APP_TYPE
          value: "backend"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: webapp-demo
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
