global
    daemon
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend application_gateway
    bind *:443 ssl crt /etc/ssl/certs/server.pem

    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"

    http-request deny if { path_reg -i .*(union|select|insert|drop).* }
    http-request deny if { path_reg -i .*(<script|javascript:).* }
    http-request deny if { path_reg -i .*(\.\./).* }

    default_backend secure_web_servers

backend secure_web_servers

    balance roundrobin

    server east web-east:80 check
    server west web-west:80 check
    server central web-central:80 check

frontend http_redirect
    bind *:80
    redirect scheme https

listen stats
    bind *:8404

    stats enable
    stats uri /stats
    stats auth admin:password
